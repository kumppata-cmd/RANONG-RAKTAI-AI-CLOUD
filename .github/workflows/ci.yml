# RANONG RAKTAI AI — CI/CD Pipeline
# ทดสอบอัตโนมัติเมื่อ push หรือ PR ไปยัง main/feature branches

name: CI Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Tesseract OCR + Thai
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-tha \
            tesseract-ocr-eng

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          STORAGE_BACKEND: local
          TESTING_DOCS: "true"
          APP_ENV: testing
          LINE_CHANNEL_SECRET: test-ci-secret-value
          LINE_CHANNEL_ACCESS_TOKEN: test-ci-token-value
        run: |
          python3 -c "import test_cloud; test_cloud.main()"

      - name: Security check — no secrets in code
        run: |
          echo "Checking for hardcoded secrets..."
          # ตรวจว่าไม่มี API key / private key ในโค้ด (ข้ามไฟล์ test)
          if grep -rn "AKIA\|sk-ant-\|AIza\|-----BEGIN.*KEY" --include="*.py" --exclude="test_*.py" .; then
            echo "ERROR: Possible secrets found in source code!"
            exit 1
          fi
          echo "OK: No hardcoded secrets found"

      - name: Security check — external AI locked
        run: |
          echo "Checking EXTERNAL_AI_CLASSIFICATION_ALLOWED..."
          if grep -q "EXTERNAL_AI_CLASSIFICATION_ALLOWED = True" server.py; then
            echo "ERROR: External AI classification is enabled in code!"
            exit 1
          fi
          echo "OK: External AI classification is locked (False)"

      - name: Security check — no public GCS access
        run: |
          echo "Checking for public bucket access..."
          if grep -rn "make_public\|allUsers\|allAuthenticatedUsers" --include="*.py" .; then
            echo "ERROR: Possible public GCS access found!"
            exit 1
          fi
          echo "OK: No public GCS access patterns found"
