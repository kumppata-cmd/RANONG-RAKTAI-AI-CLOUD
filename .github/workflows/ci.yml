# =============================================================================
# RANONG RAKTAI AI — CI Pipeline
# ระบบ CI อัตโนมัติสำหรับ RANONG-RAKTAI-AI-CLOUD
# ทำงานทุกครั้งที่ push หรือ PR ไป branch main
# =============================================================================

name: CI — RANONG RAKTAI AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ยกเลิก run เก่าเมื่อมี push ใหม่บน branch เดียวกัน
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint — ตรวจสอบ syntax และ style
  # ---------------------------------------------------------------------------
  lint:
    name: "Lint & Syntax Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install flake8

      - name: "Python syntax check (py_compile)"
        run: |
          echo "=== ตรวจสอบ syntax ไฟล์ Python ทั้งหมด ==="
          find . -name "*.py" -not -path "./.git/*" -not -path "./__pycache__/*" | while read f; do
            python -m py_compile "$f" && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: "Flake8 basic lint"
        run: |
          echo "=== Flake8 lint (E9,F63,F7,F82) ==="
          flake8 --version
          # รัน flake8 — fatal errors เท่านั้น (E9,F63,F7,F82)
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=.git,__pycache__,*.backup*,test_*.py,tests/ \
            --format='::error file=%(path)s,line=%(row)d,col=%(col)d::%(code)s %(text)s'

  # ---------------------------------------------------------------------------
  # Job 2: Test — รัน pytest
  # ---------------------------------------------------------------------------
  test:
    name: "Tests"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tha tesseract-ocr-eng

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ── Gate 1: ชุดทดสอบหลัก 1,100+ เคสใน root ──────────────────
      # เดิม CI ไม่เคยรันชุดนี้เลย (รันแค่ pytest tests/) และยังปิดท้าย
      # ด้วย || true ทำให้ test ล้มไม่ทำให้ CI แดง — CI เขียวจึงไม่ใช่
      # หลักฐานว่า test ผ่าน (ดู TECHNICAL_DEBT_REGISTER TD-2)
      - name: "Tests — unittest suite (root)"
        env:
          # ค่า dummy ขั้นต่ำเพื่อให้ import ได้ ไม่ใช่ค่าจริง
          LINE_CHANNEL_ACCESS_TOKEN: "ci-test-dummy-token"
          LINE_CHANNEL_SECRET: "ci-test-dummy-secret"
          ADMIN_SECRET: "ci-test-admin-secret"
          GCS_BUCKET_NAME: "ci-test-bucket"
        run: |
          echo "=== unittest: root test_*.py (1,148 เคส) ==="
          # ระบุ module ตรง ๆ ไม่ใช้ discover เพราะ discover จะไล่เข้าไปใน
          # tests/ (เป็น package) แล้วรัน test แบบ pytest ด้วย runner ผิดตัว
          python -m unittest $(ls test_*.py | sed 's/\.py$//' | tr '\n' ' ') -v

      # ── Gate 2: ชุดทดสอบ pytest ใน tests/ ──────────────────────
      - name: "Tests — pytest suite (tests/)"
        env:
          LINE_CHANNEL_ACCESS_TOKEN: "ci-test-dummy-token"
          LINE_CHANNEL_SECRET: "ci-test-dummy-secret"
          ADMIN_SECRET: "ci-test-admin-secret"
          GCS_BUCKET_NAME: "ci-test-bucket"
        run: |
          echo "=== pytest tests/ ==="
          python -m pytest tests/ -v --tb=short

      - name: "Compile all modules"
        run: |
          echo "=== ตรวจสอบว่าทุก module compile ได้ ==="
          python -c "
          import py_compile, os, sys
          modules = [f for f in os.listdir('.') if f.endswith('.py') and not f.startswith('test_')]
          failed = []
          for m in sorted(modules):
              try:
                  py_compile.compile(m, doraise=True)
                  print(f'  OK: {m}')
              except py_compile.PyCompileError as e:
                  print(f'  FAIL: {m} — {e}')
                  failed.append(m)
          if failed:
              print(f'\nFailed: {len(failed)} modules')
              sys.exit(1)
          print(f'\nAll {len(modules)} modules OK')
          "

  # ---------------------------------------------------------------------------
  # Job 3: Security — ตรวจสอบความปลอดภัย
  # ---------------------------------------------------------------------------
  security:
    name: "Security Checks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      # ลำดับสำคัญ: การตรวจที่ "ต้องไม่ถูกข้าม" ต้องมาก่อน pip-audit
      #
      # บทเรียนจาก run 40271014104: ตอนตั้ง pip-audit เป็น hard gate แล้ว
      # มันล้ม → step ถัดไปถูก skip ทั้งหมด รวมถึงการตรวจ
      # EXTERNAL_AI_CLASSIFICATION_ALLOWED = False และ no public GCS access
      # ซึ่งเป็น control ที่สำคัญที่สุดและห้ามหยุดทำงานเพราะ CVE ที่ไม่เกี่ยวกัน
      - name: "ตรวจสอบ hardcoded secrets"
        run: |
          echo "=== สแกนหา secrets ที่ hardcode ในโค้ด ==="
          # ค้นหา patterns ที่อาจเป็น secrets
          FOUND=0
          for pattern in \
            'sk-[a-zA-Z0-9]{20,}' \
            'AIza[0-9A-Za-z_-]{35}' \
            'AKIA[0-9A-Z]{16}' \
            'ghp_[a-zA-Z0-9]{36}' \
            'xoxb-[0-9]{10,}' \
            'password\s*=\s*["\x27][^"\x27]{8,}["\x27]' \
          ; do
            # ข้าม test files, .git, และ CI config
            if grep -rn --include="*.py" -E "$pattern" . \
                --exclude-dir=.git \
                --exclude-dir=__pycache__ \
                --exclude="test_*.py" \
                --exclude="conftest.py" 2>/dev/null; then
              echo "WARNING: พบ pattern ที่อาจเป็น secret: $pattern"
              FOUND=1
            fi
          done
          if [ $FOUND -eq 1 ]; then
            echo "FAIL: พบ patterns ที่อาจเป็น hardcoded secrets"
            exit 1
          fi
          echo "OK: ไม่พบ hardcoded secrets"

      - name: "ตรวจสอบ EXTERNAL_AI_CLASSIFICATION_ALLOWED = False"
        run: |
          echo "=== ตรวจสอบว่า External AI ถูกล็อกไว้ ==="
          if grep -q "EXTERNAL_AI_CLASSIFICATION_ALLOWED = False" server.py; then
            echo "OK: EXTERNAL_AI_CLASSIFICATION_ALLOWED = False (ล็อกไว้ที่ระดับโค้ด)"
          else
            echo "FAIL: EXTERNAL_AI_CLASSIFICATION_ALLOWED ต้องเป็น False ในโค้ด!"
            exit 1
          fi

      - name: "ตรวจสอบ no public GCS access"
        run: |
          echo "=== ตรวจสอบว่าไม่มี public GCS access ==="
          if grep -rn "make_public\|allUsers\|allAuthenticatedUsers" --include="*.py" --exclude="test_*.py" .; then
            echo "FAIL: พบ public GCS access patterns!"
            exit 1
          fi
          echo "OK: ไม่พบ public GCS access patterns"

      # pip-audit อยู่ท้ายสุดและใช้ continue-on-error โดยเจตนา
      #
      # สถานะจริงที่ยืนยันแล้ว (run 40271014104): pip-audit --strict
      # "ล้ม" บน dependency ชุดปัจจุบัน — ยังไม่ทราบว่าเป็น CVE ตัวใด
      # เพราะ container ที่ audit ติดตั้ง pip-audit ไม่ได้ (proxy ปฏิเสธ
      # PyPI 403) และดึง CI log ไม่ได้ (results-receiver ถูกปฏิเสธ 403)
      #
      # แก้แล้ว (2026-10-26): step นี้ส่งผลออกทาง GitHub annotations และ
      # step summary ด้วย scripts/pip_audit_annotate.py — ทั้งสองอย่าง
      # อ่านได้ทาง REST API ปกติ จึงไม่ต้องพึ่ง log ใน blob storage
      #   GET /repos/{owner}/{repo}/check-runs/{check_run_id}/annotations
      #
      # เหตุผลที่ไม่ปิดเป็น hard gate ตอนนี้:
      #   ยังไม่ได้ประเมินว่าเป็น CVE ที่กระทบระบบจริงหรือไม่ การบล็อก
      #   deploy ทั้งหมดด้วยสิ่งที่ยังไม่ประเมิน จะขัดขวางการ deploy แก้ไข
      #   ความปลอดภัยทางคลินิกที่เร่งด่วนกว่า
      # เหตุผลที่ไม่ใช้ "|| echo" (ของเดิม):
      #   || echo ทำให้ exit code เป็น 0 — ผลหายไปทั้งจาก UI และ API
      #   continue-on-error ยังรัน pip-audit จริงและ log เต็มอยู่ใน UI
      #
      # ข้อจำกัดที่ต้องรู้ (ยืนยันแล้ว เทียบ run 40270798487 กับ 40271014104):
      #   continue-on-error ทำให้ Actions API รายงาน step นี้เป็น
      #   conclusion=success แม้คำสั่งจะ exit non-zero
      #   → ห้ามสรุปว่า pip-audit ผ่านจากสถานะ step นี้
      #   วิธีดูผลจริงมีทางเดียว: อ่าน log ของ step นี้ใน GitHub UI
      #   (ผมเคยสรุปผิดจากจุดนี้มาแล้วครั้งหนึ่ง — ดู TD-14)
      #
      # TODO(security, P1): ดู log ของ step นี้ว่าเป็น CVE ตัวใด แล้ว
      #   (ก) upgrade dependency ถ้าแก้ได้ หรือ
      #   (ข) ใส่ --ignore-vuln <ID> พร้อมเหตุผลและวันที่ review
      #   แล้วจึงลบ continue-on-error ออกให้เป็น hard gate
      #   ห้ามลบ step นี้ทิ้งเพื่อให้ CI เขียว
      - name: "pip-audit — ตรวจ dependency vulnerabilities (advisory)"
        continue-on-error: true
        run: |
          echo "=== ตรวจสอบ vulnerabilities ใน dependencies ==="
          set +e
          pip-audit --strict --desc --format json --output /tmp/pip-audit.json
          AUDIT_RC=$?
          set -e
          echo "pip-audit exit code: $AUDIT_RC"

          # รายงานแบบอ่านง่ายใน UI (ไม่ให้ความล้มเหลวหยุด step)
          pip-audit --strict --desc || true

          # ส่งผลออกทาง annotation + step summary ซึ่งอ่านได้ทาง REST API
          # ปกติ ไม่ต้องดาวน์โหลด log จาก blob storage ที่เข้าไม่ถึง
          python scripts/pip_audit_annotate.py /tmp/pip-audit.json "$AUDIT_RC"

          exit $AUDIT_RC

  # ---------------------------------------------------------------------------
  # Job 4: Dependency Check — ตรวจสอบ packages
  # ---------------------------------------------------------------------------
  dependency-check:
    name: "Dependency Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "ตรวจสอบ outdated packages"
        run: |
          echo "=== ตรวจสอบ packages ที่ล้าสมัย ==="
          pip list --outdated --format=columns || true

      - name: "ตรวจสอบ requirements.txt consistency"
        run: |
          echo "=== ตรวจสอบ requirements.txt ==="
          # ตรวจว่าทุก package ใน requirements.txt ติดตั้งได้
          pip check || echo "WARNING: พบปัญหา dependency compatibility"
          echo "OK: requirements.txt consistent"
