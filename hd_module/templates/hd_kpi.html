{% extends "hd_base.html" %}
{% block title %}KPI Dashboard{% endblock %}
{% block page_title %}📊 KPI Dashboard{% endblock %}

{% block content %}
<div class="kpi-grid" id="kpiGrid">
  <div class="kpi-loading">⏳ กำลังโหลดข้อมูล KPI...</div>
</div>

<script>
async function loadKPI() {
  const grid = document.getElementById('kpiGrid');
  try {
    const resp = await hdFetch('/hd/api/v1/kpi?period=monthly');
    if (!resp.ok) {
      grid.innerHTML = '<div class="kpi-error">❌ ไม่สามารถโหลด KPI ได้ (กรุณา login ก่อน)</div>';
      return;
    }
    const data = await resp.json();
    renderKPI(data);
  } catch(e) {
    grid.innerHTML = '<div class="kpi-error">❌ เชื่อมต่อไม่ได้: ' + e.message + '</div>';
  }
}

function renderKPI(data) {
  const grid = document.getElementById('kpiGrid');
  const d = data.demographics || {};
  const esa = data.esa || {};
  const va = data.vascular_access || {};
  const anemia = data.anemia || {};
  const alerts = data.alerts || {};
  const sessions = data.sessions || {};

  let html = '';

  // Stat cards row
  html += '<div class="stat-row">';
  html += statCard('👥', d.total_patients || 0, 'ผู้ป่วยทั้งหมด');
  html += statCard('💊', esa.total_on_esa || 0, 'ใช้ ESA');
  html += statCard('⚠️', alerts.total || 0, 'Alerts');
  html += statCard('🏥', sessions.total || 0, 'Sessions');
  html += '</div>';

  // ESA Distribution
  if (esa.distribution && Object.keys(esa.distribution).length > 0) {
    html += '<div class="kpi-card"><h3>💊 ยา ESA</h3><div class="bar-chart">';
    const total = esa.total_on_esa || 1;
    for (const [name, count] of Object.entries(esa.distribution)) {
      const pct = (count / total * 100).toFixed(0);
      html += `<div class="bar-item">
        <span class="bar-label">${name}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <span class="bar-value">${count} (${pct}%)</span>
      </div>`;
    }
    html += '</div></div>';
  }

  // Schedule Distribution
  if (d.schedule_distribution && Object.keys(d.schedule_distribution).length > 0) {
    html += '<div class="kpi-card"><h3>🗓️ ตารางฟอก</h3><div class="bar-chart">';
    const total = d.total_patients || 1;
    for (const [sched, count] of Object.entries(d.schedule_distribution)) {
      const pct = (count / total * 100).toFixed(0);
      html += `<div class="bar-item">
        <span class="bar-label">${sched}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <span class="bar-value">${count} (${pct}%)</span>
      </div>`;
    }
    html += '</div></div>';
  }

  // Vascular Access
  if (va && Object.keys(va).length > 0) {
    html += '<div class="kpi-card"><h3>🩸 Vascular Access</h3><div class="bar-chart">';
    const vaTotal = Object.values(va).reduce((a,b)=>a+b, 0);
    for (const [type, count] of Object.entries(va)) {
      const pct = (count / vaTotal * 100).toFixed(0);
      html += `<div class="bar-item">
        <span class="bar-label">${type}</span>
        <div class="bar-track"><div class="bar-fill va-fill" style="width:${pct}%"></div></div>
        <span class="bar-value">${count} (${pct}%)</span>
      </div>`;
    }
    html += '</div></div>';
  }

  // Alert breakdown
  if (alerts.total > 0) {
    html += `<div class="kpi-card"><h3>⚠️ Alerts (เดือนนี้)</h3>
      <div class="alert-grid">
        <div class="alert-stat critical">🚨 ${alerts.critical || 0}<br><small>Critical</small></div>
        <div class="alert-stat warning">⚠️ ${alerts.warning || 0}<br><small>Warning</small></div>
        <div class="alert-stat info">ℹ️ ${alerts.info || 0}<br><small>Info</small></div>
        <div class="alert-stat ack">✅ ${alerts.acknowledged || 0}<br><small>Ack'd</small></div>
      </div>`;
    if (alerts.avg_ack_time_min > 0) {
      html += `<p style="text-align:center;color:var(--muted);margin-top:8px">⏱️ Avg ack: ${alerts.avg_ack_time_min.toFixed(0)} min</p>`;
    }
    html += '</div>';
  }

  grid.innerHTML = html;
}

function statCard(icon, value, label) {
  return `<div class="stat-card">
    <div class="stat-icon">${icon}</div>
    <div class="stat-value">${value}</div>
    <div class="stat-label">${label}</div>
  </div>`;
}

/* 🚫 สถิติขาดฟอก/ยกเลิก/ส่งต่อ — การ์ดเพิ่มท้ายหน้า (additive) */
async function loadCancelStats(){
  try{
    const r = await hdFetch('/hd/api/v1/stats/cancellations?months=3');
    const d = await r.json();
    if(d.error && !(d.months||[]).length) return;
    const grid = document.getElementById('kpiGrid');
    const card = document.createElement('div');
    card.className = 'kpi-card';
    const c = d.last_90d || {};
    let html = '<h3>🚫 ขาดฟอก / ยกเลิก / ส่งต่อ</h3>'
      + '<div class="alert-grid">'
      + '<div class="alert-stat critical">🙅 '+(c.noshow||0)+'<br><small>No-show 90 วัน</small></div>'
      + '<div class="alert-stat warning">📅 '+(c.postpone||0)+'<br><small>เลื่อนนัด</small></div>'
      + '<div class="alert-stat info">🏥 '+(c.referral||0)+'<br><small>ส่งต่อ รพ.</small></div>'
      + '<div class="alert-stat ack">∑ '+(c.total||0)+'<br><small>รวมยกเลิก</small></div>'
      + '</div>';
    if((d.months||[]).length){
      html += '<table style="width:100%;border-collapse:collapse;font-size:.8rem;margin-top:10px"><thead><tr style="border-bottom:1px solid var(--border)"><th style="text-align:left">เดือน</th><th>No-show</th><th>เลื่อน</th><th>ส่งต่อ</th><th>อื่นๆ/ไม่ระบุ</th><th>รวม</th></tr></thead><tbody>'
        + d.months.map(m=>{
            let ns=0,pp=0,rf=0,ot=0;
            for(const [reason,n] of Object.entries(m.by_reason||{})){
              if(reason.includes('ไม่มา')) ns+=n; else if(reason.includes('เลื่อน')) pp+=n;
              else if(reason.includes('ส่งต่อ')) rf+=n; else ot+=n;
            }
            return '<tr style="border-bottom:1px solid var(--border);text-align:center"><td style="text-align:left">'+m.month+'</td><td>'+ns+'</td><td>'+pp+'</td><td>'+rf+'</td><td>'+ot+'</td><td><b>'+m.total+'</b></td></tr>';
          }).join('') + '</tbody></table>';
    }
    if((d.top_noshow||[]).length){
      html += '<div style="font-weight:700;font-size:.85rem;margin:12px 0 4px">🙅 คนไข้ขาดฟอกบ่อย (90 วัน) — ควรโทรยืนยันก่อนวันนัด</div>'
        + d.top_noshow.map(t=>'<div style="display:flex;justify-content:space-between;font-size:.82rem;padding:4px 0;border-bottom:1px solid var(--border)"><span>'+t.hn+' — '+t.name+'</span><span style="color:var(--danger);font-weight:700">'+t.count+' ครั้ง <small style="color:var(--muted)">ล่าสุด '+(t.last_date||'-')+'</small></span></div>').join('');
    } else {
      html += '<p style="color:var(--muted);font-size:.8rem;margin-top:8px">ยังไม่มีข้อมูล no-show (เริ่มเก็บเหตุผลตั้งแต่ 21 พ.ย. 2026)</p>';
    }
    card.innerHTML = html;
    grid.appendChild(card);
  }catch(e){ console.warn('cancel stats:', e); }
}
/* รอ KPI หลักวาดเสร็จก่อน (loadKPI ทับ grid ทั้งก้อน) แล้วค่อยต่อการ์ดสถิติยกเลิก */
Promise.resolve(loadKPI()).finally(()=>loadCancelStats());
</script>

<style>
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat-card { background: var(--bg-card); border-radius: var(--radius); padding: 16px; text-align: center; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); }
.stat-icon { font-size: 2rem; }
.stat-value { font-size: 2rem; font-weight: 700; color: var(--accent); }
.stat-label { font-size: .8rem; color: var(--fg-muted); }
.kpi-card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); }
.kpi-card h3 { margin: 0 0 12px; font-size: 1rem; }
.bar-chart { display: flex; flex-direction: column; gap: 8px; }
.bar-item { display: grid; grid-template-columns: 80px 1fr 80px; gap: 8px; align-items: center; }
.bar-label { font-size: .85rem; text-align: right; }
.bar-track { height: 20px; background: var(--border); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .5s; }
.va-fill { background: var(--success); }
.bar-value { font-size: .8rem; color: var(--fg-muted); }
.alert-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.alert-stat { padding: 12px 8px; border-radius: var(--radius-sm); font-size: 1.4rem; font-weight: 700; }
.alert-stat.critical { background: rgba(231,76,60,.1); color: var(--danger); }
.alert-stat.warning { background: rgba(243,156,18,.1); color: var(--warning); }
.alert-stat.info { background: rgba(52,152,219,.1); color: var(--info); }
.alert-stat.ack { background: rgba(39,174,96,.1); color: var(--success); }
.alert-stat small { font-size: .7rem; font-weight: 400; }
.kpi-loading, .kpi-error { text-align: center; padding: 40px; color: var(--fg-muted); }
</style>
{% endblock %}
