<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nurse Station TV — HD รักษ์ไต</title>
<style>
:root{--bg:#0b1220;--panel:#121c30;--line:#1f2b45;--fg:#e8eefb;--muted:#8a9bc0;--ok:#2ecc71;--warn:#f39c12;--crit:#e74c3c;--acc:#3b82f6;--free:#1a2540}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Thai",sans-serif;overflow:hidden}
.top{display:flex;align-items:center;gap:18px;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .ttl{font-weight:800;font-size:1.3rem;letter-spacing:.02em}
.top .clock{font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:800;margin-left:auto}
.top .sh{font-size:.95rem;color:var(--muted)}
.kp{display:flex;gap:14px;font-size:.9rem;color:var(--muted)}
.kp b{color:var(--fg);font-size:1.15rem;margin-right:3px}
.kp .c{color:var(--crit)}.kp .w{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:12px 22px;height:calc(100vh - 62px - 44px);overflow-y:auto;align-content:start;grid-auto-rows:max-content;padding-bottom:60px}
.shifts{display:flex;gap:4px}
.shifts button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:.8rem}
.shifts button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.wait{grid-column:1/-1;background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.wait b{color:var(--fg)}
.bed{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:118px;display:flex;flex-direction:column;gap:4px;position:relative;transition:background .3s}
.bed.free{background:var(--free);opacity:.55}
.bed.warning{border-color:var(--warn);box-shadow:0 0 0 2px rgba(243,156,18,.35)}
.bed.critical{border-color:var(--crit);box-shadow:0 0 0 3px rgba(231,76,60,.45);animation:pulse 1.4s infinite}
.bed.completed{opacity:.75;border-color:var(--ok)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(231,76,60,.45)}50%{box-shadow:0 0 0 7px rgba(231,76,60,.15)}}
.bed > *{flex-shrink:0}
.bed .n{position:absolute;top:8px;right:10px;font-size:.8rem;color:var(--muted);font-weight:700}
.bed .nm{font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:34px}
.bed .sub{font-size:.75rem;color:var(--muted)}
.bed .bp{font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05}
.bed .bp small{font-size:.75rem;font-weight:600;color:var(--muted);margin-left:5px}
.bed .bp.low{color:var(--crit)}.bed .bp.mid{color:var(--warn)}
.bed .row{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.bar{height:6px;background:#0d1628;border-radius:3px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--acc)}
.bar i.over{background:var(--warn)}
.spark{height:22px;width:70px}
.tag{display:inline-block;font-size:.68rem;font-weight:800;padding:1px 7px;border-radius:9px;background:rgba(255,255,255,.08)}
.tag.c{background:rgba(231,76,60,.25);color:#ff8a80}.tag.w{background:rgba(243,156,18,.25);color:#ffd27a}.tag.o{background:rgba(46,204,113,.2);color:#8ff0b3}
.bed .al{font-size:.78rem;color:#ffb4ad;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stale{color:var(--warn)}
.tick{position:fixed;left:0;right:0;bottom:0;height:44px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;overflow:hidden;font-size:1rem}
.tick .lab{padding:0 16px;font-weight:800;color:var(--crit);flex:none;border-right:1px solid var(--line);height:100%;display:flex;align-items:center}
.tick .inner{white-space:nowrap;padding-left:100%;animation:scroll 40s linear infinite;will-change:transform}
.tick .inner.still{animation:none;padding-left:16px}
@keyframes scroll{to{transform:translateX(-100%)}}
@keyframes blinker{50%{opacity:0.3}}
.btn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.8rem}
.off{position:fixed;inset:0;background:rgba(11,18,32,.92);display:none;align-items:center;justify-content:center;font-size:1.3rem;color:var(--warn);z-index:9}
@media (max-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));padding:8px;gap:6px;height:calc(100vh - 100px - 44px)}.bed{min-height:84px;padding:8px 10px;gap:2px}.bed .bp{font-size:1.2rem}.bed .nm{font-size:.95rem}.bed .row{font-size:.72rem}.top{padding:8px 10px;gap:8px;flex-wrap:wrap}.top .ttl{font-size:1rem}.kp{display:none}.top .clock{font-size:1.2rem}}
</style>
</head>
<body>
<div class="top">
  <div class="ttl">🏥 HD รักษ์ไต · Nurse Station</div>
  <div class="shifts" id="shifts">
    <button data-s="all" class="on" onclick="setShift('all')">ทั้งวัน</button>
    <button data-s="morning" onclick="setShift('morning')">🌅 เช้า</button>
    <button data-s="afternoon" onclick="setShift('afternoon')">☀️ บ่าย</button>
    <button data-s="evening" onclick="setShift('evening')">🌙 ค่ำ</button>
  </div>
  <div class="kp" id="kp"></div>
  <button class="btn" onclick="toggleFs()">⛶ เต็มจอ</button>
  <div class="clock" id="clock">--:--</div>
</div>
<div class="grid" id="grid"></div>
<div class="tick"><div class="lab">🚨 ALERT</div><div class="inner still" id="tick">กำลังโหลด…</div></div>
<div class="off" id="off">⚠️ ขาดการเชื่อมต่อ — กำลังลองใหม่…</div>
<script>
const TOKEN = (new URLSearchParams(location.search).get('token')) || (function(){ try { return sessionStorage.getItem('hd_token') || localStorage.getItem('hd_token') || ''; } catch(e){ return ''; } })();
if(!TOKEN) location.href = '/hd/login?next=' + encodeURIComponent(location.pathname + location.search);
const REFRESH = 20000;
function thaiNow(){ const n = new Date(); return new Date(n.getTime() + (n.getTimezoneOffset() + 420) * 60000); }
function detectShift(){ const h = thaiNow().getHours(); if(h >= 7 && h < 13) return 'morning'; if(h >= 13 && h < 17) return 'afternoon'; return 'evening'; }
const SH_TH = {morning:'🌅 รอบเช้า', afternoon:'☀️ รอบบ่าย', evening:'🌙 รอบค่ำ'};
const SHIFTS = ['morning','afternoon','evening'];
let shiftSel = 'all';
function setShift(sv){ shiftSel = sv; document.querySelectorAll('.shifts button').forEach(b=>b.classList.toggle('on', b.dataset.s===sv)); load(); }
const RANK = {critical:6, warning:5, active:4, pre_hd:3, done:2, available:1, free:1, empty:1};
/* merge the three shift payloads: per bed keep the most "live" session; sum completed */
function mergeShifts(payloads){
  const beds = {}, done = [], seenDone = new Set();
  let today = [];
  payloads.forEach(d => {
    if(!d) return;
    (d.beds||[]).forEach(b => {
      const cur = beds[b.bed_number];
      if(!cur || (RANK[b.status]||0) > (RANK[cur.status]||0)) beds[b.bed_number] = Object.assign({}, b, {shift: d.shift});
      else if(cur && b.next_scheduled && !cur.next_scheduled) cur.next_scheduled = b.next_scheduled;
    });
    (d.completed_sessions||[]).forEach(c => { const k = c.session_id || (c.bed_number+':'+c.patient_hn); if(!seenDone.has(k)){ seenDone.add(k); done.push(c); } });
    if((d.today_patients||[]).length > today.length) today = d.today_patients;
  });
  const list = Object.values(beds).sort((a,b)=>a.bed_number-b.bed_number);
  return {beds: list, completed_sessions: done, completed_in_shift: done.length, today_patients: today};
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tick(){
  const t = thaiNow();
  document.getElementById('clock').textContent = t.toTimeString().slice(0,5);
  // Live countdown — update every second for active beds
  document.querySelectorAll('[data-start][data-dur]').forEach(el => {
    const st = new Date(el.dataset.start);
    const total = parseFloat(el.dataset.dur) * 60; // minutes
    const mins = Math.max(0, (Date.now() - st.getTime()) / 60000);
    const left = Math.max(0, total - mins);
    const lm = Math.round(left);
    const h = Math.floor(lm / 60), m = lm % 60;
    const over = mins > total;
    if (left <= 0) {
      el.textContent = '✅ ครบเวลา';
      el.style.color = '#2ecc71';
      el.style.fontWeight = '900';
    } else if (left <= 30) {
      el.textContent = `⏱ ${h}:${String(m).padStart(2,'0')} ใกล้ครบ!`;
      el.style.color = '#f39c12';
      el.style.fontWeight = '800';
      el.style.animation = left <= 10 ? 'blinker 1s step-start infinite' : '';
    } else {
      el.textContent = `เหลือ ${h}:${String(m).padStart(2,'0')} ชม.`;
      el.style.color = '';
      el.style.fontWeight = '';
    }
  });
}
setInterval(tick, 1000); tick();
function toggleFs(){ try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch(e){} }

function spark(arr){
  if(!arr || arr.length < 2) return '';
  const w=70,h=22,lo=Math.min(...arr)-5,hi=Math.max(...arr)+5;
  const pts = arr.map((v,i)=>`${(i/(arr.length-1))*w},${h-(v-lo)/(hi-lo)*h}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${arr[arr.length-1] < 100 ? '#e74c3c' : '#8a9bc0'}" stroke-width="2" points="${pts}"/></svg>`;
}
function elapsed(b){
  if(!b.start_time) return {txt:'', pct:0};
  const st = new Date(b.start_time), mins = Math.max(0, (Date.now() - st.getTime())/60000), total = (b.duration_hours||4)*60;
  const left = Math.max(0, total - mins);
  const lm = Math.round(left);
  return {txt: left <= 0 ? 'ครบเวลา' : `เหลือ ${Math.floor(lm/60)}:${String(lm%60).padStart(2,'0')} ชม.`, pct: Math.min(100, mins/total*100), over: mins > total};
}
function ago(iso){ if(!iso) return null; return Math.round((Date.now() - new Date(iso).getTime())/60000); }

function render(d){
  const beds = d.beds || [];
  const done = new Set((d.completed_sessions||[]).map(c=>c.bed_number));
  let crit=0, warn=0, act=0;
  document.getElementById('grid').innerHTML = beds.map(b=>{
    const st = b.status || 'free';
    if(st==='critical') crit++; else if(st==='warning') warn++;
    if(['active','warning','critical'].includes(st)) act++;
    if(st==='available' || st==='free' || st==='done' || st==='empty'){
      const nx = b.next_scheduled ? `<div class="sub">ถัดไป: ${esc(b.next_scheduled)}</div>` : '';
      return `<div class="bed free"><div class="n">${b.bed_number}</div><div class="nm">${(st==='done'||done.has(b.bed_number))?'✅ ฟอกเสร็จแล้ว':'ว่าง'}</div>${nx}</div>`;
    }
    if(st==='pre_hd'){
      return `<div class="bed" style="border-style:dashed"><div class="n">เตียง ${b.bed_number}</div><div class="nm">${esc(b.patient_name||'')}</div><div class="sub">${esc(b.vascular_access||'')}</div><div class="row"><span class="tag">⏳ รอเริ่มฟอก</span></div></div>`;
    }
    const v = b.current_vitals || {}, e = elapsed(b), mAgo = ago(b.last_vital_at);
    const bpCls = v.sbp ? (v.sbp < 90 ? 'low' : (v.sbp < 100 ? 'mid' : '')) : '';
    const uf = b.uf_goal ? Math.min(100, Math.round((b.uf_removed||0)/b.uf_goal*100)) : null;
    const idh = b.idh_risk && b.idh_risk.level !== 'low' ? `<span class="tag ${b.idh_risk.level==='high'?'c':'w'}">IDH ${b.idh_risk.score}</span>` : '';
    const uw = b.uf_watch && b.uf_watch.flag && !['ok','no_goal'].includes(b.uf_watch.flag) ? `<span class="tag ${b.uf_watch.flag==='high_rate'?'c':'w'}">${b.uf_watch.flag_th}${b.uf_watch.flag==='target_reduced'?' −'+b.uf_watch.reduced_ml:(b.uf_watch.behind_ml>100&&!b.uf_watch.reduced_ml&&!b.uf_watch.extend_min?' −'+b.uf_watch.behind_ml:'')}</span>` : '';
    const al = (b.alerts||[]).filter(a=>!a.physician_order && a.severity!=='info')[0];
    return `<div class="bed ${st}">
      <div class="n">เตียง ${b.bed_number}</div>
      <div class="nm">${esc(b.patient_name||'')}${b.serology&&(b.serology.hbsag==='positive'||b.serology.antihcv==='positive')?` <span style="color:#ff5c5c;font-weight:900;border:2px solid #ff5c5c;border-radius:6px;padding:0 6px;font-size:.8em;white-space:nowrap">🩸 ${[b.serology.hbsag==='positive'?'HBsAg+':'',b.serology.antihcv==='positive'?'Anti-HCV+':''].filter(Boolean).join(' ')}</span>`:''}</div>
      <div class="sub">${esc(b.vascular_access||'')}${b.esa_given?' · 💉ESA':''} ${idh}${b.shift_mismatch&&b.usual_shift?` <span class="tag w">⇄ ปกติ${({morning:'เช้า',afternoon:'บ่าย',evening:'ค่ำ'})[b.usual_shift]}</span>`:''}</div>
      <div class="row"><div class="bp ${bpCls}">${v.sbp?`${v.sbp}/${v.dbp||'-'}<small>HR ${v.hr||'-'}</small>`:'<span style="color:var(--muted);font-size:1rem">ยังไม่วัด BP</span>'}</div><span style="flex:1"></span>${spark(b.sbp_trend)}</div>
      <div class="row"><span class="${mAgo!=null&&mAgo>45?'stale':''}">${mAgo!=null?`วัดล่าสุด ${mAgo} นาที`:''}</span><span style="flex:1"></span><span data-start="${b.start_time||''}" data-dur="${b.duration_hours||4}">${e.txt}</span></div>
      <div class="row">${uf!=null?`UF <div class="bar"><i class="${e.over?'over':''}" style="width:${uf}%"></i></div> ${uf}%`:`<div class="bar"><i style="width:${e.pct}%"></i></div>`} ${uw}</div>
      ${al?`<div class="al">🚨 ${esc(al.title)}${al.message?' — '+esc(al.message):''}</div>`:''}
    </div>`;
  }).join('');
  const onBed = new Set(beds.map(b=>b.patient_hn).filter(Boolean).concat((d.completed_sessions||[]).map(c=>c.patient_hn).filter(Boolean)));
  const waiting = (d.today_patients||[]).filter(p => !onBed.has(p.hn));
  if(waiting.length){
    document.getElementById('grid').insertAdjacentHTML('beforeend', `<div class="wait"><b>⏳ นัดวันนี้ ยังไม่ขึ้นเตียง ${waiting.length} คน</b>` +
      waiting.slice(0,30).map(p=>`<span>${esc(p.name||'')}${p.va?' · '+esc(p.va):''}</span>`).join('') + (waiting.length>30?`<span>… อีก ${waiting.length-30}</span>`:'') + `</div>`);
  }
  document.getElementById('kp').innerHTML = `<span><b>${act}</b>กำลังฟอก</span><span><b>${d.completed_in_shift||0}</b>เสร็จ</span><span class="c"><b>${crit}</b>วิกฤต</span><span class="w"><b>${warn}</b>เตือน</span><span><b>${(d.today_patients||[]).length}</b>นัดวันนี้</span>`;
  const alerts = [];
  beds.forEach(b=>(b.alerts||[]).forEach(a=>{ if(!a.physician_order && a.severity!=='info') alerts.push(`${a.severity==='critical'?'🔴':'🟠'} เตียง ${b.bed_number} ${b.patient_name||''}: ${a.title}${a.message?' — '+a.message:''}`); }));
  const t = document.getElementById('tick');
  if(alerts.length){ t.textContent = alerts.join('      •      '); t.className = 'inner'; }
  else { t.textContent = '✅ ไม่มี alert ที่รอคำสั่งแพทย์'; t.className = 'inner still'; }
}

async function fetchShift(sh){
  const r = await fetch('/hd/api/v1/dashboard/beds?shift=' + sh, {headers:{'Authorization':'Bearer ' + TOKEN}});
  if(r.status === 401){ location.href = '/hd/login?next=' + encodeURIComponent(location.pathname + location.search); throw new Error('401'); }
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function load(){
  try{
    const data = shiftSel === 'all' ? mergeShifts(await Promise.all(SHIFTS.map(fetchShift))) : await fetchShift(shiftSel);
    render(data);
    document.getElementById('off').style.display = 'none';
  }catch(e){ if(e.message !== '401') document.getElementById('off').style.display = 'flex'; }
}
load(); setInterval(load, REFRESH);
/* keep the screen awake on tablets/TV sticks when supported */
(async function(){ try { if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e){} })();
</script>
</body>
</html>
