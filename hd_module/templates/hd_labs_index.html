{% extends "hd_base.html" %}
{% block title %}🔬 Lab ผลเลือด{% endblock %}
{% block nav_labs %}active{% endblock %}
{% block page_title %}🔬 Lab ผลเลือด{% endblock %}

{% block content %}
<style>
.top-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.top-bar input{flex:1;min-width:180px;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-size:.95rem;background:var(--card-bg);color:var(--fg)}
.top-bar .btn-add{padding:8px 14px;border-radius:10px;background:#0d6efd;color:#fff;border:none;font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap}
.top-bar .btn-inactive{padding:8px 14px;border-radius:10px;background:var(--border);color:var(--fg-muted);border:none;font-size:.85rem;cursor:pointer;white-space:nowrap}
.patient-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.pcard{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px;position:relative;transition:box-shadow .2s}
.pcard:hover{box-shadow:0 2px 10px rgba(0,0,0,.1)}
.pcard .hn{font-size:.78rem;color:var(--fg-muted)}
.pcard .name{font-weight:700;font-size:.95rem;margin-top:2px}
.pcard .lab-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;font-size:.78rem}
.lab-chip{padding:3px 8px;border-radius:6px;font-weight:600}
.chip-ok{background:rgba(39,174,96,.1);color:#27ae60}
.chip-warn{background:rgba(243,156,18,.12);color:#e67e22}
.chip-bad{background:rgba(231,76,60,.1);color:#e74c3c}
.chip-none{background:var(--border);color:var(--fg-muted)}
.lab-date-row{font-size:.72rem;color:var(--fg-muted);margin-top:4px}
.btn-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn-sm{padding:5px 10px;border-radius:8px;border:none;font-size:.75rem;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn-lab{background:#0d6efd;color:#fff}.btn-edit{background:#6c757d;color:#fff}.btn-del{background:transparent;color:#dc3545;border:1px solid #dc3545}
.btn-restore{background:#198754;color:#fff}
/* Modal */
.modal-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card-bg);border-radius:16px;padding:20px;max-width:380px;width:90%;max-height:85vh;overflow-y:auto}
.modal h3{margin:0 0 12px}
.modal label{display:block;font-size:.8rem;font-weight:600;margin-top:10px;color:var(--fg-muted)}
.modal input,.modal select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;margin-top:4px;background:var(--bg);color:var(--fg)}
.modal .btn-row{margin-top:16px;justify-content:flex-end}
.modal .btn-primary{background:#0d6efd;color:#fff;padding:8px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.modal .btn-cancel{background:var(--border);color:var(--fg);padding:8px 16px;border:none;border-radius:8px;cursor:pointer}
.stat-bar{display:flex;gap:12px;margin-bottom:12px;font-size:.8rem;flex-wrap:wrap}
.stat-bar .stat{padding:6px 12px;border-radius:8px;background:var(--card-bg);border:1px solid var(--border);font-weight:600}
</style>

<!-- Stats Bar -->
<div class="stat-bar" id="statsBar"></div>

<!-- Top Bar -->
<div class="top-bar">
  <input type="text" id="searchBox" placeholder="🔍 ค้นหา HN หรือชื่อ..." oninput="filterPatients()">
  <button class="btn-add" onclick="openAddModal()">➕ เพิ่มคนไข้</button>
  <button class="btn-inactive" onclick="showInactive()">📦 ที่ระงับ</button>
</div>

<!-- Patient List -->
<div class="patient-list" id="patientList">
  <div style="text-align:center;color:var(--fg-muted);grid-column:1/-1;">กำลังโหลด...</div>
</div>

<!-- Add Patient Modal -->
<div class="modal-bg" id="addModal">
  <div class="modal">
    <h3>➕ เพิ่มคนไข้ใหม่</h3>
    <label>HN *</label><input id="addHn" placeholder="เช่น 67001">
    <label>ชื่อ-สกุล *</label><input id="addName" placeholder="เช่น นายสมชาย ใจดี">
    <label>Hospital HN</label><input id="addHospHn" placeholder="เลข รพ. (ถ้ามี)">
    <label>เส้นฟอก</label><input id="addVA" placeholder="AVF Lt., Perm cath">
    <label>ตารางฟอก</label><input id="addSched" placeholder="จ,พ,ศ">
    <label>DW (kg)</label><input id="addDW" type="number" step="0.1" placeholder="60.0">
    <label>รอบ</label>
    <select id="addShift"><option value="morning">เช้า</option><option value="afternoon">บ่าย</option><option value="evening">ค่ำ</option></select>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal('addModal')">ยกเลิก</button>
      <button class="btn-primary" onclick="submitAdd()">บันทึก</button>
    </div>
  </div>
</div>

<!-- Edit Patient Modal -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3>✏️ แก้ไขข้อมูลคนไข้</h3>
    <input type="hidden" id="editHn">
    <label>ชื่อ-สกุล</label><input id="editName">
    <label>Hospital HN</label><input id="editHospHn">
    <label>เส้นฟอก</label><input id="editVA">
    <label>ตารางฟอก</label><input id="editSched">
    <label>DW (kg)</label><input id="editDW" type="number" step="0.1">
    <label>รอบ</label>
    <select id="editShift"><option value="morning">เช้า</option><option value="afternoon">บ่าย</option><option value="evening">ค่ำ</option></select>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal('editModal')">ยกเลิก</button>
      <button class="btn-primary" onclick="submitEdit()">บันทึก</button>
    </div>
  </div>
</div>

<!-- Inactive Patients Modal -->
<div class="modal-bg" id="inactiveModal">
  <div class="modal">
    <h3>📦 คนไข้ที่ระงับ</h3>
    <div id="inactiveList" style="font-size:.85rem">กำลังโหลด...</div>
    <div class="btn-row"><button class="btn-cancel" onclick="closeModal('inactiveModal')">ปิด</button></div>
  </div>
</div>

<script>
let _patients = [];
const ROLE = (function(){ try{const t=localStorage.getItem('hd_token');if(!t)return '';const p=JSON.parse(atob(t.split('.')[1]));return p.role||''}catch(e){return ''} })();
const isAdmin = ROLE === 'admin' || ROLE === 'physician';

function loadPatients(){
  hdFetch('/hd/api/v1/patients/with-lab-summary').then(r=>{
    if(!r.ok) throw new Error('API '+r.status);
    return r.json();
  }).then(data=>{
    if(data.error) console.warn('with-lab-summary error:', data.error);
    _patients = data.patients || [];
    if(_patients.length){
      renderStats();
      renderPatients(_patients);
    } else {
      /* Fallback: use basic /patients API */
      _loadBasicPatients();
    }
  }).catch(()=>{
    _loadBasicPatients();
  });
}
function _loadBasicPatients(){
  hdFetch('/hd/api/v1/patients').then(r=>r.ok?r.json():Promise.reject()).then(data=>{
    _patients = (data.patients||[]).map(p=>({
      hn: p.hn, patient_name: p.patient_name, vascular_access: p.vascular_access,
      schedule_days: p.schedule_days, default_shift: p.default_shift,
      hb: null, k: null, ktv: null, lab_date: null, lab_age_days: null
    }));
    renderStats();
    renderPatients(_patients);
  }).catch(()=>{
    document.getElementById('patientList').innerHTML='<div style="text-align:center;color:var(--danger);grid-column:1/-1;">⚠️ โหลดข้อมูลไม่ได้ — ลอง refresh หรือ login ใหม่</div>';
  });
}

function renderStats(){
  const total = _patients.length;
  const noLab = _patients.filter(p=>!p.lab_date).length;
  const oldLab = _patients.filter(p=>p.lab_age_days && p.lab_age_days > 30).length;
  const hbLow = _patients.filter(p=>p.hb && p.hb < 10).length;
  document.getElementById('statsBar').innerHTML =
    `<div class="stat">👥 ${total} คน</div>` +
    `<div class="stat" style="color:var(--danger)">🚫 ไม่มี Lab: ${noLab}</div>` +
    `<div class="stat" style="color:#e67e22">⏰ Lab เก่า >30 วัน: ${oldLab}</div>` +
    (hbLow ? `<div class="stat" style="color:var(--danger)">🩸 Hb <10: ${hbLow}</div>` : '');
}

function hbChip(v){
  if(v==null) return '<span class="lab-chip chip-none">Hb -</span>';
  if(v<10) return `<span class="lab-chip chip-bad">Hb ${v.toFixed(1)}</span>`;
  if(v<=12) return `<span class="lab-chip chip-ok">Hb ${v.toFixed(1)}</span>`;
  return `<span class="lab-chip chip-warn">Hb ${v.toFixed(1)}</span>`;
}
function kChip(v){
  if(v==null) return '<span class="lab-chip chip-none">K -</span>';
  if(v>=6) return `<span class="lab-chip chip-bad">K ${v.toFixed(1)}</span>`;
  if(v>=5.5) return `<span class="lab-chip chip-warn">K ${v.toFixed(1)}</span>`;
  return `<span class="lab-chip chip-ok">K ${v.toFixed(1)}</span>`;
}
function ktvChip(v){
  if(v==null) return '<span class="lab-chip chip-none">Kt/V -</span>';
  if(v<1.2) return `<span class="lab-chip chip-warn">Kt/V ${v.toFixed(2)}</span>`;
  return `<span class="lab-chip chip-ok">Kt/V ${v.toFixed(2)}</span>`;
}

function renderPatients(list){
  const el = document.getElementById('patientList');
  if(!list.length){ el.innerHTML='<div style="text-align:center;color:var(--fg-muted);grid-column:1/-1;">ไม่พบผู้ป่วย</div>'; return; }
  el.innerHTML = list.map(p=>{
    const hn=p.hn||'', name=p.patient_name||'';
    const labAge = p.lab_age_days;
    const dateStr = p.lab_date ? `Lab: ${p.lab_date}` + (labAge!=null ? ` (${labAge} วัน)` : '') : 'ยังไม่มีผล Lab';
    const dateClass = !p.lab_date ? 'color:var(--fg-muted)' : (labAge>30 ? 'color:#e67e22' : '');
    return `<div class="pcard">
      <div class="hn">HN: ${hn}${p.schedule_days?' · '+p.schedule_days:''}${p.vascular_access?' · '+p.vascular_access:''}</div>
      <div class="name">${name||'(ไม่มีชื่อ)'}</div>
      <div class="lab-row">${hbChip(p.hb)}${kChip(p.k)}${ktvChip(p.ktv)}</div>
      <div class="lab-date-row" style="${dateClass}">${dateStr}</div>
      <div class="btn-row">
        <a class="btn-sm btn-lab" href="/hd/labs/${hn}">🔬 Lab</a>
        ${isAdmin?`<button class="btn-sm btn-edit" onclick="event.stopPropagation();openEdit('${hn}','${esc(name)}','${esc(p.hospital_hn||'')}','${esc(p.vascular_access||'')}','${esc(p.schedule_days||'')}',${p.dry_weight||"''"},'${p.default_shift||'morning'}')">✏️ แก้ไข</button>`:''}
        ${isAdmin?`<button class="btn-sm btn-del" onclick="event.stopPropagation();deactivate('${hn}','${esc(name)}')">🗑️</button>`:''}
      </div>
    </div>`;
  }).join('');
}
function esc(s){ return String(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

function filterPatients(){
  const q=document.getElementById('searchBox').value.toLowerCase();
  if(!q){renderPatients(_patients);return;}
  renderPatients(_patients.filter(p=>(p.hn||'').toLowerCase().includes(q)||(p.patient_name||'').toLowerCase().includes(q)));
}

/* ── Add ── */
function openAddModal(){ document.getElementById('addModal').classList.add('open'); document.getElementById('addHn').focus(); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function submitAdd(){
  const hn=document.getElementById('addHn').value.trim();
  const name=document.getElementById('addName').value.trim();
  if(!hn||!name){alert('ต้องระบุ HN และชื่อ');return;}
  hdFetch('/hd/api/v1/patients/create',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({hn, patient_name:name, hospital_hn:document.getElementById('addHospHn').value.trim(),
      vascular_access:document.getElementById('addVA').value.trim(),
      schedule_days:document.getElementById('addSched').value.trim(),
      dry_weight:parseFloat(document.getElementById('addDW').value)||null,
      default_shift:document.getElementById('addShift').value})
  }).then(r=>r.json()).then(d=>{
    if(d.error){alert(d.error);return;}
    closeModal('addModal'); loadPatients();
  });
}

/* ── Edit ── */
function openEdit(hn,name,hospHn,va,sched,dw,shift){
  document.getElementById('editHn').value=hn;
  document.getElementById('editName').value=name;
  document.getElementById('editHospHn').value=hospHn;
  document.getElementById('editVA').value=va;
  document.getElementById('editSched').value=sched;
  document.getElementById('editDW').value=dw;
  document.getElementById('editShift').value=shift;
  document.getElementById('editModal').classList.add('open');
}
function submitEdit(){
  const hn=document.getElementById('editHn').value;
  hdFetch('/hd/api/v1/patients/'+hn+'/edit',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({patient_name:document.getElementById('editName').value.trim(),
      hospital_hn:document.getElementById('editHospHn').value.trim(),
      vascular_access:document.getElementById('editVA').value.trim(),
      schedule_days:document.getElementById('editSched').value.trim(),
      dry_weight:parseFloat(document.getElementById('editDW').value)||null,
      default_shift:document.getElementById('editShift').value})
  }).then(r=>r.json()).then(d=>{
    if(d.error){alert(d.error);return;}
    closeModal('editModal'); loadPatients();
  });
}

/* ── Deactivate ── */
function deactivate(hn,name){
  if(!confirm(`⚠️ ระงับคนไข้ ${name} (HN ${hn})?\n\nข้อมูลจะไม่ถูกลบ สามารถกู้คืนได้`)) return;
  if(!confirm(`ยืนยันอีกครั้ง: ระงับ ${name}?`)) return;
  hdFetch('/hd/api/v1/patients/'+hn+'/deactivate',{method:'POST'}).then(r=>r.json()).then(d=>{
    if(d.error){alert(d.error);return;}
    loadPatients();
  });
}

/* ── Inactive list + Restore ── */
function showInactive(){
  document.getElementById('inactiveModal').classList.add('open');
  document.getElementById('inactiveList').innerHTML='กำลังโหลด...';
  hdFetch('/hd/api/v1/patients/inactive').then(r=>r.json()).then(d=>{
    const list = d.patients||[];
    if(!list.length){document.getElementById('inactiveList').innerHTML='<div style="color:var(--fg-muted)">ไม่มีคนไข้ที่ระงับ</div>';return;}
    document.getElementById('inactiveList').innerHTML = list.map(p=>
      `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <div><b>${p.patient_name||'-'}</b><br><span style="font-size:.72rem;color:var(--fg-muted)">HN: ${p.hn}</span></div>
        <button class="btn-sm btn-restore" onclick="restorePatient('${p.hn}')">♻️ กู้คืน</button>
      </div>`
    ).join('');
  });
}
function restorePatient(hn){
  hdFetch('/hd/api/v1/patients/'+hn+'/reactivate',{method:'POST'}).then(r=>r.json()).then(d=>{
    if(d.error){alert(d.error);return;}
    showInactive(); loadPatients();
  });
}

loadPatients();
</script>
{% endblock %}
