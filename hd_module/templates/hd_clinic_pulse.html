{% extends "hd_base.html" %}
{% block title %}Clinic Pulse — รักษ์ไต{% endblock %}
{% block content %}
<div style="max-width:900px;margin:0 auto;padding:8px">

<!-- Health Score Header -->
<div id="pulseHeader" style="text-align:center;padding:16px;border-radius:16px;margin-bottom:12px;background:linear-gradient(135deg,#1e40af,#7c3aed);color:#fff">
  <div style="font-size:.8rem;opacity:.8">🫀 CLINIC PULSE — LIVE</div>
  <div id="healthScore" style="font-size:3.5rem;font-weight:900;line-height:1">---</div>
  <div id="healthLabel" style="font-size:1rem;font-weight:600;margin-top:4px"></div>
  <div id="pulseTime" style="font-size:.75rem;opacity:.7;margin-top:4px"></div>
</div>

<!-- Stats Row -->
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px">
  <div class="card" style="padding:10px;text-align:center">
    <div id="statActive" style="font-size:1.8rem;font-weight:800;color:var(--primary)">-</div>
    <div style="font-size:.7rem;color:var(--fg-muted)">กำลังฟอก</div>
  </div>
  <div class="card" style="padding:10px;text-align:center">
    <div id="statScheduled" style="font-size:1.8rem;font-weight:800;color:#f59e0b">-</div>
    <div style="font-size:.7rem;color:var(--fg-muted)">รอเริ่ม</div>
  </div>
  <div class="card" style="padding:10px;text-align:center">
    <div id="statCompleted" style="font-size:1.8rem;font-weight:800;color:var(--success)">-</div>
    <div style="font-size:.7rem;color:var(--fg-muted)">เสร็จแล้ว</div>
  </div>
  <div class="card" style="padding:10px;text-align:center">
    <div id="statAlerts" style="font-size:1.8rem;font-weight:800;color:var(--danger)">-</div>
    <div style="font-size:.7rem;color:var(--fg-muted)">Alert ค้าง</div>
  </div>
</div>

<!-- Critical Banner -->
<div id="criticalBanner" style="display:none;padding:12px 16px;background:#fef2f2;border:2px solid #dc2626;border-radius:12px;margin-bottom:12px;animation:pulse 1s infinite">
  <div style="font-weight:800;color:#dc2626;font-size:1rem">🚨 CRITICAL</div>
  <div id="criticalList" style="font-size:.88rem;color:#991b1b;margin-top:4px"></div>
</div>

<!-- Bed Cards -->
<div id="bedGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px">
</div>

<div id="noBeds" style="display:none;text-align:center;padding:40px;color:var(--fg-muted)">
  <div style="font-size:3rem">🏥</div>
  <p>ไม่มีเตียงที่กำลังฟอกตอนนี้</p>
</div>

</div>

<style>
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes blink{0%,100%{border-color:#dc2626}50%{border-color:transparent}}
.bed-card{padding:12px;border-radius:12px;border:2px solid var(--border);transition:all .3s}
.bed-card.critical{border-color:#dc2626;animation:blink 1s infinite;background:#fef2f2}
.bed-card.warning{border-color:#f59e0b;background:#fffbeb}
.bed-card .bed-num{font-size:1.2rem;font-weight:800;color:var(--primary)}
.bed-card .bp{font-size:1.3rem;font-weight:800}
.uf-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0}
.uf-fill{height:100%;border-radius:3px;transition:width .5s}
</style>

<script>
let criticalAudio = null;

async function loadPulse(){
  try{
    const r = await hdFetch('/hd/api/v1/clinic-pulse');
    const d = await r.json();
    if(d.error) return;

    // Health score
    const score = d.health_score;
    const scoreEl = document.getElementById('healthScore');
    scoreEl.textContent = score;
    const headerEl = document.getElementById('pulseHeader');
    if(d.health_level === 'critical'){
      headerEl.style.background = 'linear-gradient(135deg,#991b1b,#dc2626)';
      document.getElementById('healthLabel').textContent = '⚠️ ต้องดูแลทันที';
    } else if(d.health_level === 'warning'){
      headerEl.style.background = 'linear-gradient(135deg,#92400e,#f59e0b)';
      document.getElementById('healthLabel').textContent = '🟡 มีจุดที่ต้องระวัง';
    } else {
      headerEl.style.background = 'linear-gradient(135deg,#1e40af,#7c3aed)';
      document.getElementById('healthLabel').textContent = '✅ คลินิกทำงานปกติ';
    }
    document.getElementById('pulseTime').textContent = 'อัปเดต '+d.timestamp+' · '+d.date;

    // Stats
    document.getElementById('statActive').textContent = d.active_count;
    document.getElementById('statScheduled').textContent = d.today?.scheduled || 0;
    document.getElementById('statCompleted').textContent = d.today?.completed || 0;
    document.getElementById('statAlerts').textContent = d.alerts?.unack || 0;

    // Critical banner
    const cb = document.getElementById('criticalBanner');
    if(d.critical_count > 0){
      cb.style.display = 'block';
      document.getElementById('criticalList').innerHTML = d.critical_beds.map(b=>
        `🔴 เตียง ${b.bed}: ${b.name} — BP ${b.sbp}/${b.dbp} ${b.critical}`
      ).join('<br>');
      // Sound alert
      if(!criticalAudio){
        try{criticalAudio=new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQ==');}catch(e){}
      }
    } else {
      cb.style.display = 'none';
    }

    // Bed cards
    const grid = document.getElementById('bedGrid');
    const noBeds = document.getElementById('noBeds');
    if(d.active_beds.length === 0){
      grid.innerHTML = '';
      noBeds.style.display = 'block';
      return;
    }
    noBeds.style.display = 'none';

    grid.innerHTML = d.active_beds.map(b=>{
      const cls = b.critical ? 'critical' : (b.warning ? 'warning' : '');
      const bpColor = b.sbp < 90 ? '#dc2626' : (b.sbp < 100 ? '#f59e0b' : (b.sbp > 160 ? '#dc2626' : 'var(--fg)'));
      const ufPct = b.uf_pct || 0;
      const ufColor = ufPct > 100 ? '#dc2626' : (ufPct > 80 ? '#16a34a' : '#2563eb');
      const staleIcon = b.stale_bp ? ' <span style="color:#f59e0b" title="BP เก่า">⏰</span>' : '';
      return `<div class="card bed-card ${cls}" onclick="location.href='/hd/session/${b.session_id}'" style="cursor:pointer">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="bed-num">🛏 ${b.bed}</span>
          <span style="font-size:.75rem;color:var(--fg-muted)">⏱ ${b.elapsed||'-'}</span>
        </div>
        <div style="font-weight:600;font-size:.88rem;margin:4px 0">${b.name}</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span class="bp" style="color:${bpColor}">${b.sbp||'-'}/${b.dbp||'-'}</span>${staleIcon}
          <span style="font-size:.8rem;color:var(--fg-muted)">HR ${b.hr||'-'}</span>
        </div>
        <div class="uf-bar"><div class="uf-fill" style="width:${Math.min(ufPct,100)}%;background:${ufColor}"></div></div>
        <div style="font-size:.7rem;color:var(--fg-muted)">UF ${b.uf_removed||0}/${b.uf_goal||0} mL (${ufPct}%)</div>
      </div>`;
    }).join('');
  }catch(e){console.error('pulse:',e);}
}

// Auto-refresh every 10 seconds
loadPulse();
setInterval(loadPulse, 10000);
</script>
{% endblock %}
