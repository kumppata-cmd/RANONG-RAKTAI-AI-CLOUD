# RANONG RAKTAI AI — Render Blueprint
# ใช้ Docker เพื่อติดตั้ง Tesseract OCR + Thai language pack

services:
  - type: web
    name: ranong-raktai-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore  # ใกล้ประเทศไทยที่สุด
    plan: starter      # เริ่มต้นที่ starter ($7/mo)
    # เสถียรภาพ (24 พ.ย. 2569): ใช้ liveness ตัวเบา — /health เดิมยิง GCS 2 ครั้งทุกการเช็ค
    # ช่วงพยาบาลใช้พร้อมกัน thread เต็ม → /health ตอบช้า → Render คิดว่าตาย → restart = 502
    # (ต้องตั้งค่าเดียวกันใน Render Dashboard > Settings > Health Check Path ด้วย)
    healthCheckPath: /health/live
    envVars:
      # PORT — Render กำหนดอัตโนมัติ (ไม่ต้องตั้งเอง)

      # LINE Messaging API (ตั้งค่าใน Render Dashboard)
      - key: LINE_CHANNEL_SECRET
        sync: false  # ตั้งค่าด้วยตนเองใน Dashboard
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false

      # Claude API (ตั้งค่าใน Render Dashboard — ปิดด้วย code lock)
      - key: ANTHROPIC_API_KEY
        sync: false

      # ระบบ
      - key: APP_ENV
        value: "production"  # Production — รับเอกสารจริง, GCS-only, ไม่มี local fallback
      - key: ENABLE_AI_CLASSIFY
        value: "true"
      - key: STORAGE_BACKEND
        value: "gcs"  # Production ต้องใช้ "gcs" เท่านั้น
      - key: BASE_DIR
        value: "/tmp/ranong_raktai"

      # Google Cloud Storage (ตั้งค่าใน Render Dashboard)
      # แนะนำ: ใช้ GCS_BUCKET_NAME + GOOGLE_APPLICATION_CREDENTIALS (ADC)
      - key: GCS_BUCKET_NAME
        sync: false  # ชื่อ Production bucket (ห้ามใช้ test bucket)
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false  # path ไปที่ Service Account JSON Key (ADC)
      # ─ ทางเลือก (backward-compatible) ─
      # - key: STORAGE_BUCKET        # alias ของ GCS_BUCKET_NAME
      # - key: GCS_CREDENTIALS_BASE64  # Base64 ของ JSON Key (ถ้าไม่ใช้ ADC)

      # LIFF Mini-App — หน้าให้ผู้ป่วยดูผลแล็บ (ตั้งค่าใน Render Dashboard)
      #
      # ทั้งสองค่านี้หาได้จาก LINE Developers Console
      # ที่ LINE Login channel ซึ่งผูกกับ LIFF app:
      #   LIFF_ID         — แท็บ LIFF → คอลัมน์ LIFF ID
      #                     (รูปแบบ 1234567890-AbCdEfGh)
      #   LIFF_CHANNEL_ID — แท็บ Basic settings → Channel ID
      #                     (ตัวเลขล้วน เช่น 1234567890)
      #
      # LIFF_CHANNEL_ID ใช้ตรวจ aud ของ ID token ฝั่ง server (SEC-1)
      # ถ้าไม่ตั้ง endpoint /liff/api/my-labs จะปฏิเสธทุกคำขอโดยเจตนา
      # (fail-closed) ตรวจสถานะได้ที่ /health → liff_channel_id_set
      - key: LIFF_ID
        sync: false
      - key: LIFF_CHANNEL_ID
        sync: false

      # ─── สิทธิ์ผู้ใช้ และผู้รับการแจ้งเตือนค่าวิกฤต ───────────
      #
      # สี่ค่านี้เคยไม่ได้ประกาศไว้ที่นี่ จึงไม่มีช่องให้กรอกใน Render
      # Dashboard ใครไม่รู้ว่ามีก็จะไม่ได้ตั้ง — และระบบไม่บอกอะไร
      # จนกระทั่งตรวจเจอว่า alert ค่าวิกฤตไม่เคยถึงใคร (26 ต.ค. 2026)
      #
      # ⚠️ รูปแบบค่าไม่เหมือนกัน และนี่คือจุดที่พลาดได้ง่ายที่สุด
      #
      #   AUTHORIZED_USERS  SHA-256 hash ของ LINE userId (hex 64 ตัว)
      #   ADMIN_USERS       SHA-256 hash  (hex 64 ตัว)
      #   PHYSICIAN_USERS   SHA-256 hash  (hex 64 ตัว)
      #     ทั้งสามใช้ "ตรวจสิทธิ์" จึงเก็บเป็น hash ไม่เก็บ ID ดิบ
      #     ขอ hash ของตัวเองได้จาก LINE ด้วยคำสั่งลงทะเบียนของระบบ
      #
      #   ALERT_RECIPIENTS  LINE userId ดิบ (U + hex 32 ตัว) — ไม่บังคับ
      #     ใช้ "ส่งข้อความ" ซึ่ง LINE push API ต้องใช้ ID ดิบ
      #     ใส่ hash ที่นี่จะ push ไม่ได้เลย — ระบบจะคัดออกและขึ้น
      #     ERROR ใน log พร้อมบอกสาเหตุ
      #     รองรับหลายคนด้วยการคั่นด้วยจุลภาค และรับ group id (C...)
      #     ได้ด้วย ถ้าคลินิกใช้กลุ่มพยาบาล
      #
      #     วิธีที่แนะนำกว่าสำหรับการเพิ่มคน: ไม่ต้องแตะ ENV เลย
      #       1. ผู้ดูแลขอรหัสจาก POST /admin/enroll
      #       2. เจ้าตัวพิมพ์ "ยืนยัน <รหัส>" ใน LINE แล้วจะได้ hash
      #       3. ผู้ดูแลส่ง hash นั้นไปที่
      #          POST /admin/api/v2/alerts/recipients {hash, role}
      #     ระบบเก็บ LINE ID ไว้เองตอนขั้นที่ 2 จึงไม่มีใครต้องเห็นหรือ
      #     ส่ง LINE ID ให้กัน และการเพิ่ม/ลบมีผลทันทีไม่ต้อง redeploy
      #
      # ตรวจผลได้ที่ /health → critical_alert_delivery
      #   can_deliver / recipients / problem  (ไม่แสดง ID ของใคร)
      - key: AUTHORIZED_USERS
        sync: false
      - key: ADMIN_USERS
        sync: false
      - key: PHYSICIAN_USERS
        sync: false
      - key: ALERT_RECIPIENTS
        sync: false
